<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Youth Engagement Calendar</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; color: #333; min-height: 100vh; padding: 30px 20px; }
    h1 { text-align: center; margin-bottom: 24px; font-size: 1.8rem; color: #2d3748; }
    .container { max-width: 900px; margin: 0 auto; }
    .calendar-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; margin-bottom: 28px; }
    .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    .cal-header h2 { font-size: 1.3rem; color: #2d3748; }
    .nav-btn { background: #edf2f7; border: none; border-radius: 8px; padding: 8px 16px; cursor: pointer; font-size: 1rem; color: #4a5568; transition: background 0.2s; }
    .nav-btn:hover { background: #e2e8f0; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .day-label { text-align: center; font-size: 0.75rem; font-weight: 600; color: #718096; padding: 6px 0; text-transform: uppercase; }
    .day-cell { min-height: 64px; border-radius: 10px; padding: 6px; cursor: pointer; background: #f7fafc; border: 2px solid transparent; transition: all 0.15s; position: relative; }
    .day-cell:hover { background: #ebf4ff; border-color: #bee3f8; }
    .day-cell.empty { background: transparent; cursor: default; }
    .day-cell.today { background: #ebf8ff; border-color: #4299e1; }
    .day-num { font-size: 0.85rem; font-weight: 600; color: #4a5568; text-align: center; }
    .day-cell.today .day-num { color: #2b6cb0; }
    .event-dots { display: flex; flex-wrap: wrap; gap: 2px; margin-top: 4px; justify-content: center; }
    .event-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: center; justify-content: center; }
    .modal-overlay.active { display: flex; }
    .modal { background: white; border-radius: 16px; padding: 28px; width: 100%; max-width: 460px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); animation: slideUp 0.2s ease; }
    @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .modal-header h3 { font-size: 1.1rem; color: #2d3748; }
    .close-btn { background: none; border: none; font-size: 1.4rem; cursor: pointer; color: #a0aec0; line-height: 1; }
    .close-btn:hover { color: #4a5568; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; font-weight: 600; color: #718096; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.04em; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 9px 12px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 0.95rem; color: #2d3748; transition: border-color 0.2s; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { outline: none; border-color: #4299e1; }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .add-btn { width: 100%; padding: 11px; background: #4299e1; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 4px; }
    .add-btn:hover { background: #3182ce; }
    .add-btn:disabled { background: #a0aec0; cursor: not-allowed; }
    .events-list { margin-top: 20px; }
    .events-list h4 { font-size: 0.85rem; font-weight: 600; color: #718096; text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 10px; }
    .event-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: #f7fafc; margin-bottom: 8px; }
    .event-color-bar { width: 4px; min-height: 40px; border-radius: 4px; flex-shrink: 0; }
    .event-info { flex: 1; }
    .event-title { font-weight: 600; font-size: 0.9rem; color: #2d3748; }
    .event-time { font-size: 0.78rem; color: #718096; margin-top: 1px; }
    .event-desc { font-size: 0.82rem; color: #4a5568; margin-top: 4px; }
    .delete-btn { background: none; border: none; color: #fc8181; cursor: pointer; font-size: 1rem; padding: 2px 4px; border-radius: 4px; transition: background 0.15s; }
    .delete-btn:hover { background: #fff5f5; }
    .no-events { text-align: center; color: #a0aec0; font-size: 0.88rem; padding: 12px 0; }
    .upcoming-card { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px; }
    .upcoming-card h3 { font-size: 1.1rem; color: #2d3748; margin-bottom: 16px; }
    .upcoming-item { display: flex; gap: 14px; align-items: flex-start; padding: 12px 0; border-bottom: 1px solid #edf2f7; }
    .upcoming-item:last-child { border-bottom: none; }
    .upcoming-date-box { text-align: center; background: #ebf8ff; border-radius: 10px; padding: 8px 12px; min-width: 52px; flex-shrink: 0; }
    .upcoming-date-box .u-day { font-size: 1.3rem; font-weight: 700; color: #2b6cb0; line-height: 1; }
    .upcoming-date-box .u-month { font-size: 0.7rem; color: #4299e1; text-transform: uppercase; font-weight: 600; }
    .upcoming-info .u-title { font-weight: 600; color: #2d3748; font-size: 0.92rem; }
    .upcoming-info .u-time { font-size: 0.78rem; color: #718096; margin-top: 2px; }
    .upcoming-info .u-desc { font-size: 0.82rem; color: #4a5568; margin-top: 3px; }
    .no-upcoming { text-align: center; color: #a0aec0; font-size: 0.9rem; padding: 16px 0; }
    .color-options { display: flex; gap: 8px; flex-wrap: wrap; }
    .color-opt { width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 3px solid transparent; transition: border-color 0.15s, transform 0.15s; }
    .color-opt:hover { transform: scale(1.15); }
    .color-opt.selected { border-color: #2d3748; }
    .pw-modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; align-items: center; justify-content: center; }
    .pw-modal-overlay.active { display: flex; }
    .pw-modal { background: white; border-radius: 16px; padding: 28px; width: 100%; max-width: 360px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); animation: slideUp 0.2s ease; text-align: center; }
    .pw-modal h3 { font-size: 1.1rem; color: #2d3748; margin-bottom: 6px; }
    .pw-modal p { font-size: 0.85rem; color: #718096; margin-bottom: 18px; }
    .pw-modal input { width: 100%; padding: 10px 14px; border: 1.5px solid #e2e8f0; border-radius: 8px; font-size: 1rem; color: #2d3748; text-align: center; letter-spacing: 0.15em; font-family: inherit; margin-bottom: 10px; transition: border-color 0.2s; }
    .pw-modal input:focus { outline: none; border-color: #4299e1; }
    .pw-modal input.error { border-color: #e53e3e; background: #fff5f5; }
    .pw-error-msg { font-size: 0.82rem; color: #e53e3e; margin-bottom: 10px; min-height: 18px; }
    .pw-btn-row { display: flex; gap: 10px; margin-top: 4px; }
    .pw-confirm-btn { flex: 1; padding: 10px; background: #4299e1; color: white; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .pw-confirm-btn:hover { background: #3182ce; }
    .pw-cancel-btn { flex: 1; padding: 10px; background: #edf2f7; color: #4a5568; border: none; border-radius: 8px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
    .pw-cancel-btn:hover { background: #e2e8f0; }

    /* Sync status indicator */
    .sync-status { text-align: center; font-size: 0.78rem; color: #a0aec0; margin-bottom: 10px; min-height: 18px; }
    .sync-status.syncing { color: #ed8936; }
    .sync-status.synced  { color: #48bb78; }
    .sync-status.error   { color: #e53e3e; }
  </style>
</head>
<body>

<div class="container">
  <h1>📅 Calendar of Events</h1>
  <div class="sync-status" id="syncStatus">Connecting…</div>

  <div class="calendar-card">
    <div class="cal-header">
      <button class="nav-btn" onclick="changeMonth(-1)">&#8592; Prev</button>
      <h2 id="monthLabel"></h2>
      <button class="nav-btn" onclick="changeMonth(1)">Next &#8594;</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
  </div>

  <div class="upcoming-card">
    <h3>Upcoming Events</h3>
    <div id="upcomingList"></div>
  </div>
</div>

<!-- Day Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <h3 id="modalDateTitle"></h3>
      <button class="close-btn" onclick="closeModal()">&#x2715;</button>
    </div>
    <div class="form-group">
      <label>Event Title</label>
      <input type="text" id="eventTitle" placeholder="e.g. Team Meeting" />
    </div>
    <div class="form-group">
      <label>Time</label>
      <input type="time" id="eventTime" />
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="eventDesc" placeholder="Optional details…"></textarea>
    </div>
    <div class="form-group">
      <label>Colour</label>
      <div class="color-options" id="colorOptions"></div>
    </div>
    <button class="add-btn" id="addBtn" onclick="requestPassword('add')">Add Event</button>
    <div class="events-list">
      <h4>Events on this day</h4>
      <div id="dayEventsList"></div>
    </div>
  </div>
</div>

<!-- Password Modal -->
<div class="pw-modal-overlay" id="pwModalOverlay">
  <div class="pw-modal">
    <h3>🔒 Admin Access Required</h3>
    <p>Enter the admin password to continue.</p>
    <input type="password" id="pwInput" placeholder="Password" maxlength="20" />
    <div class="pw-error-msg" id="pwErrorMsg"></div>
    <div class="pw-btn-row">
      <button class="pw-cancel-btn" onclick="cancelPassword()">Cancel</button>
      <button class="pw-confirm-btn" onclick="confirmPassword()">Confirm</button>
    </div>
  </div>
</div>

<!--
  ─────────────────────────────────────────────────────────────────
  FIREBASE SETUP
  1. Go to https://console.firebase.google.com and create a project.
  2. Add a Web app and copy the firebaseConfig object below.
  3. In the Firebase console, go to Realtime Database → Create database.
     Choose "Start in test mode" (you can tighten rules later).
  4. Replace the placeholder firebaseConfig values below with your own.
  ─────────────────────────────────────────────────────────────────
-->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getDatabase, ref, onValue, set, remove, push }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

  // ── REPLACE THIS BLOCK WITH YOUR OWN FIREBASE CONFIG ──────────
  const firebaseConfig = {
    apiKey:            "YOUR_API_KEY",
    authDomain:        "YOUR_PROJECT.firebaseapp.com",
    databaseURL:       "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
    projectId:         "YOUR_PROJECT",
    storageBucket:     "YOUR_PROJECT.appspot.com",
    messagingSenderId: "YOUR_SENDER_ID",
    appId:             "YOUR_APP_ID"
  };
  // ──────────────────────────────────────────────────────────────

  const app = initializeApp(firebaseConfig);
  const db  = getDatabase(app);
  const eventsRef = ref(db, 'calendarEvents');

  // ── Constants ─────────────────────────────────────────────────
  const COLORS = ['#4299e1','#48bb78','#ed8936','#e53e3e','#9f7aea','#38b2ac','#f6ad55','#fc8181'];
  const ADMIN_PASSWORD = 'TYNADMIN';

  let selectedColor  = COLORS[0];
  let viewYear       = new Date().getFullYear();
  let viewMonth      = new Date().getMonth();
  let selectedDateKey = null;
  let pendingAction  = null;

  // Local mirror of the Firebase data — updated in real time via onValue
  let events = {};

  // ── Firebase real-time listener ───────────────────────────────
  // onValue fires immediately with current data, then again on every change.
  // This is what makes the calendar shared: every browser tab / device
  // sees the same data the moment it changes.
  setSyncStatus('Connecting…', '');
  onValue(eventsRef, snapshot => {
    events = snapshot.val() || {};
    renderCalendar();
    // Re-render the open day modal if one is open
    if (selectedDateKey) renderDayEvents();
    setSyncStatus('Live — changes sync instantly', 'synced');
  }, err => {
    setSyncStatus('Connection error: ' + err.message, 'error');
  });

  function setSyncStatus(msg, cls) {
    const el = document.getElementById('syncStatus');
    el.textContent = msg;
    el.className = 'sync-status ' + cls;
  }

  // ── Helpers ───────────────────────────────────────────────────
  function dateKey(y, m, d) {
    return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function formatTime(t) {
    if (!t) return '';
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const hour = h % 12 || 12;
    return `${hour}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  // ── Password modal ────────────────────────────────────────────
  function requestPassword(action) {
    if (action === 'add') {
      const title = document.getElementById('eventTitle').value.trim();
      if (!title) { document.getElementById('eventTitle').focus(); return; }
    }
    pendingAction = action;
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').classList.remove('error');
    document.getElementById('pwErrorMsg').textContent = '';
    document.getElementById('pwModalOverlay').classList.add('active');
    setTimeout(() => document.getElementById('pwInput').focus(), 80);
  }

  function confirmPassword() {
    const entered = document.getElementById('pwInput').value;
    if (entered === ADMIN_PASSWORD) {
      document.getElementById('pwModalOverlay').classList.remove('active');
      executeAction(pendingAction);
      pendingAction = null;
    } else {
      document.getElementById('pwInput').classList.add('error');
      document.getElementById('pwErrorMsg').textContent = 'Incorrect password. Please try again.';
      document.getElementById('pwInput').value = '';
      document.getElementById('pwInput').focus();
    }
  }

  function cancelPassword() {
    document.getElementById('pwModalOverlay').classList.remove('active');
    document.getElementById('pwInput').value = '';
    document.getElementById('pwErrorMsg').textContent = '';
    pendingAction = null;
  }

  function executeAction(action) {
    if (action === 'add') addEvent();
    else deleteEvent(selectedDateKey, action);
  }

  // ── Calendar rendering ────────────────────────────────────────
  function buildColorPicker() {
    const container = document.getElementById('colorOptions');
    container.innerHTML = '';
    COLORS.forEach(c => {
      const div = document.createElement('div');
      div.className = 'color-opt' + (c === selectedColor ? ' selected' : '');
      div.style.background = c;
      div.onclick = () => { selectedColor = c; buildColorPicker(); };
      container.appendChild(div);
    });
  }

  function renderCalendar() {
    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];
    document.getElementById('monthLabel').textContent = `${monthNames[viewMonth]} ${viewYear}`;

    const grid = document.getElementById('calGrid');
    grid.innerHTML = '';

    ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(d => {
      const lbl = document.createElement('div');
      lbl.className = 'day-label';
      lbl.textContent = d;
      grid.appendChild(lbl);
    });

    const firstDay    = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const today       = new Date();

    for (let i = 0; i < firstDay; i++) {
      const empty = document.createElement('div');
      empty.className = 'day-cell empty';
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const cell = document.createElement('div');
      cell.className = 'day-cell';

      const isToday = d === today.getDate() &&
                      viewMonth === today.getMonth() &&
                      viewYear  === today.getFullYear();
      if (isToday) cell.classList.add('today');

      const key       = dateKey(viewYear, viewMonth, d);
      // Firebase stores events per date as an object keyed by push IDs,
      // so we convert to an array here for rendering.
      const dayEvents = events[key] ? Object.values(events[key]) : [];

      const numDiv = document.createElement('div');
      numDiv.className = 'day-num';
      numDiv.textContent = d;
      cell.appendChild(numDiv);

      if (dayEvents.length > 0) {
        const dots = document.createElement('div');
        dots.className = 'event-dots';
        dayEvents.slice(0, 4).forEach(ev => {
          const dot = document.createElement('div');
          dot.className = 'event-dot';
          dot.style.background = ev.color || COLORS[0];
          dots.appendChild(dot);
        });
        cell.appendChild(dots);
      }

      cell.onclick = () => openModal(viewYear, viewMonth, d);
      grid.appendChild(cell);
    }

    renderUpcoming();
  }

  function openModal(y, m, d) {
    selectedDateKey = dateKey(y, m, d);
    const monthNames = ['January','February','March','April','May','June',
                        'July','August','September','October','November','December'];
    document.getElementById('modalDateTitle').textContent = `${d} ${monthNames[m]} ${y}`;
    document.getElementById('eventTitle').value = '';
    document.getElementById('eventTime').value  = '';
    document.getElementById('eventDesc').value  = '';
    buildColorPicker();
    renderDayEvents();
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() {
    document.getElementById('modalOverlay').classList.remove('active');
    selectedDateKey = null;
  }

  // ── Add / Delete (write to Firebase) ─────────────────────────
  async function addEvent() {
    const title = document.getElementById('eventTitle').value.trim();
    if (!title) { document.getElementById('eventTitle').focus(); return; }

    const time  = document.getElementById('eventTime').value;
    const desc  = document.getElementById('eventDesc').value.trim();

    setSyncStatus('Saving…', 'syncing');
    const btn = document.getElementById('addBtn');
    btn.disabled = true;

    try {
      // push() creates a unique child key under calendarEvents/<dateKey>/
      const dayRef = ref(db, `calendarEvents/${selectedDateKey}`);
      await push(dayRef, { title, time, desc, color: selectedColor });

      document.getElementById('eventTitle').value = '';
      document.getElementById('eventTime').value  = '';
      document.getElementById('eventDesc').value  = '';
      // onValue listener will fire and re-render automatically
    } catch (err) {
      setSyncStatus('Save failed: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function deleteEvent(dk, pushId) {
    setSyncStatus('Deleting…', 'syncing');
    try {
      // Remove the specific event node by its Firebase push ID
      await remove(ref(db, `calendarEvents/${dk}/${pushId}`));
      // onValue listener will fire and re-render automatically
    } catch (err) {
      setSyncStatus('Delete failed: ' + err.message, 'error');
    }
  }

  // ── Day events list ───────────────────────────────────────────
  function renderDayEvents() {
    const container = document.getElementById('dayEventsList');
    // Convert Firebase object (keyed by push ID) to array of [id, event] pairs
    const dayObj    = events[selectedDateKey] || {};
    const dayEvents = Object.entries(dayObj); // [[pushId, eventData], …]

    if (dayEvents.length === 0) {
      container.innerHTML = '<div class="no-events">No events yet. Add one above!</div>';
      return;
    }

    container.innerHTML = '';
    dayEvents.forEach(([pushId, ev]) => {
      const item = document.createElement('div');
      item.className = 'event-item';

      const bar = document.createElement('div');
      bar.className = 'event-color-bar';
      bar.style.background = ev.color || COLORS[0];

      const info = document.createElement('div');
      info.className = 'event-info';
      info.innerHTML = `
        <div class="event-title">${escHtml(ev.title)}</div>
        ${ev.time ? `<div class="event-time">&#128336; ${formatTime(ev.time)}</div>` : ''}
        ${ev.desc ? `<div class="event-desc">${escHtml(ev.desc)}</div>` : ''}
      `;

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.title = 'Delete event';
      del.innerHTML = '&#128465;';
      // Pass the Firebase push ID so we can remove the exact node
      del.onclick = () => requestPassword(pushId);

      item.appendChild(bar);
      item.appendChild(info);
      item.appendChild(del);
      container.appendChild(item);
    });
  }

  // ── Upcoming events ───────────────────────────────────────────
  function renderUpcoming() {
    const container = document.getElementById('upcomingList');
    const today = new Date();
    today.setHours(0, 0, 0, 0);

    const upcoming = Object.entries(events)
      .filter(([k]) => new Date(k + 'T00:00:00') >= today)
      .sort(([a], [b]) => new Date(a) - new Date(b))
      .slice(0, 8);

    if (upcoming.length === 0) {
      container.innerHTML = '<div class="no-upcoming">No upcoming events. Click a date to add one!</div>';
      return;
    }

    const monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    container.innerHTML = '';

    upcoming.forEach(([key, evObj]) => {
      const dt      = new Date(key + 'T00:00:00');
      const evList  = Object.values(evObj); // convert push-ID object to array
      evList.forEach(ev => {
        const item = document.createElement('div');
        item.className = 'upcoming-item';
        item.innerHTML = `
          <div class="upcoming-date-box">
            <div class="u-day">${dt.getDate()}</div>
            <div class="u-month">${monthShort[dt.getMonth()]}</div>
          </div>
          <div class="upcoming-info">
            <div class="u-title">${escHtml(ev.title)}</div>
            ${ev.time ? `<div class="u-time">&#128336; ${formatTime(ev.time)}</div>` : ''}
            ${ev.desc ? `<div class="u-desc">${escHtml(ev.desc)}</div>` : ''}
          </div>
        `;
        container.appendChild(item);
      });
    });
  }

  // ── Month navigation ──────────────────────────────────────────
  function changeMonth(dir) {
    viewMonth += dir;
    if (viewMonth > 11) { viewMonth = 0; viewYear++; }
    if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
    renderCalendar();
  }

  // ── Event listeners ───────────────────────────────────────────
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  document.getElementById('pwInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') confirmPassword();
  });

  document.getElementById('eventTitle').addEventListener('keydown', e => {
    if (e.key === 'Enter') requestPassword('add');
  });

  // Expose nav buttons to global scope (they use onclick= in HTML)
  window.changeMonth      = changeMonth;
  window.closeModal       = closeModal;
  window.requestPassword  = requestPassword;
  window.confirmPassword  = confirmPassword;
  window.cancelPassword   = cancelPassword;
</script>
</body>
</html>
